# Nama workflow
name: CI Backend Karsajobs

# Workflow ini jalan kalau ada push ke branch karsajobs
on:
  push:
    branches:
      - karsajobs

jobs:
  # JOB 1: Lint Dockerfile
  lint-dockerfile:
    runs-on: ubuntu-latest

    steps:
      # Ambil source code dari repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install hadolint
      - name: Install hadolint
        run: |
          sudo wget -O /usr/local/bin/hadolint \
          https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64
          sudo chmod +x /usr/local/bin/hadolint

      # Jalankan hadolint ke Dockerfile
      - name: Run hadolint
        run: hadolint Dockerfile

  # JOB 2: Test Go App
  test-app:
    runs-on: ubuntu-latest
    needs: lint-dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Go
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      # Jalankan unit test 
      - name: Run unit test
        run: go test -v -short --count=1 $(go list ./...)


  # JOB 3: Build & Push Image
  build-app-karsajobs:
    runs-on: ubuntu-latest
    needs: test-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Login ke GHCR
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build & push image
      - name: Build and Push Docker Image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/karsajobs:latest .
          docker push ghcr.io/${{ github.repository_owner }}/karsajobs:latest
